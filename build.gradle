plugins {
    id 'fabric-loom' version "${loom_version}"
}

fabricApi {
    configureTests {
        createSourceSet = true
    }
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

sourceSets {
    main.java.srcDir "src/shared/java"
    test.java.srcDir "src/sharedTest/java"
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    testImplementation "org.junit.jupiter:junit-jupiter:${project.junit_version}"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:${project.junit_version}"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

def hasCommandLineTestFilter = gradle.startParameter.taskRequests.any { request ->
    request.args.contains("--tests")
}

test {
    useJUnitPlatform()
    afterSuite { descriptor, result ->
        if (descriptor.parent == null && !hasCommandLineTestFilter && filter.includePatterns.empty && result.testCount != 54) {
            throw new GradleException("Expected 54 root tests, but ran ${result.testCount}.")
        }
    }
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
